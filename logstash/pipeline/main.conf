input {
  file {
    path => "/data/logs/json/smart_building_logs.json"
    mode => "read"
    exit_after_read => true
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => "json"
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "smartbuilding-logs-%{+YYYY.MM.dd}"
    document_id => "%{event_id}"
  }
}
