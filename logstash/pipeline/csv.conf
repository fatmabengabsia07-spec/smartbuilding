input {
  file {
    path => "/data/logs/csv/*.csv"
    mode => "read"
    sincedb_path => "/dev/null"
    file_completed_action => "log"
    file_completed_log_path => "/tmp/logstash_csv_completed.log"
    discover_interval => 5
    tags => ["csv"]
  }
}

filter {
  csv {
    separator => ","
    columns => ["timestamp", "sensor_id", "sensor_type", "zone", "value", "unit", "status", "message"]
    skip_header => true
  }
  if [timestamp] == "timestamp" { drop { } }
  grok {
    match => { "[log][file][path]" => "/data/logs/csv/(?<file_id>[^/]+?)__[^/]+$" }
    tag_on_failure => []
  }
  date { match => ["timestamp", "ISO8601"] target => "@timestamp" tag_on_failure => ["_dateparsefailure"] }
  if [value] =~ /^-?[0-9]+(\.[0-9]+)?$/ {
    mutate { convert => { "value" => "float" } }
  } else {
    mutate { add_tag => ["_valueparsefailure"] }
  }
  if [status] == "" { mutate { remove_field => ["status"] } }
  if ![level] and [status] {
    mutate { rename => { "status" => "level" } }
  }
  if ![level] and "_valueparsefailure" not in [tags] {
    mutate { add_field => { "level" => "INFO" } }
    if [sensor_type] == "temperature" {
      if [value] > 32 or [value] < 10 { mutate { replace => { "level" => "CRITICAL" } } }
      else if [value] > 28 or [value] < 16 { mutate { replace => { "level" => "WARNING" } } }
    } else if [sensor_type] == "co2" {
      if [value] > 1500 { mutate { replace => { "level" => "CRITICAL" } } }
      else if [value] > 1000 { mutate { replace => { "level" => "WARNING" } } }
    } else if [sensor_type] == "humidity" {
      if [value] < 30 or [value] > 70 { mutate { replace => { "level" => "WARNING" } } }
    }
  }
  if [level] { mutate { uppercase => ["level"] } }
  fingerprint {
    source => ["[log][file][path]", "sensor_id", "sensor_type", "@timestamp"]
    concatenate_sources => true
    method => "SHA1"
    target => "[@metadata][doc_id]"
  }
  mutate { remove_field => ["timestamp", "event", "host", "log"] }
}

output {
  if "_dateparsefailure" in [tags] or "_valueparsefailure" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "smartbuilding-errors"
    }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "smartbuilding-logs-%{+YYYY.MM.dd}"
      document_id => "%{[@metadata][doc_id]}"
    }
  }
}
